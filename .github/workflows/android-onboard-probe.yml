name: Android Head Unit Camera Probe APK
on:
  push:
    branches: [main]
    paths:
      - 'android-diagnostics/**'
      - '.github/workflows/android-onboard-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  camera2-probe-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MGR"
          yes | "$SDK_MGR" --licenses >/dev/null || true
          "$SDK_MGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android app
        working-directory: android-diagnostics
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists and manifest has correct camera scope
        run: |
          set -eux
          test -s android-diagnostics/app/build/outputs/apk/debug/app-debug.apk
          test -f android-diagnostics/app/src/main/java/com/onurdrive/diagnostics/UniversalInterfaceScanner.java
          grep -q 'android.permission.CAMERA' android-diagnostics/app/src/main/AndroidManifest.xml
          ! grep -Eq 'INTERNET|WRITE_SECURE_SETTINGS|REBOOT|MODIFY_PHONE_STATE' android-diagnostics/app/src/main/AndroidManifest.xml
          cp android-diagnostics/app/build/outputs/apk/debug/app-debug.apk OnurDriveAI-Universal-Camera-Scanner-v0.3-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OnurDriveAI-Universal-Camera-Scanner-v0.3
          path: OnurDriveAI-Universal-Camera-Scanner-v0.3-debug.apk
          if-no-files-found: error
      - name: Publish prerelease - NOT VERIFIED ON MG HS
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v0.3.0-universal-scanner"
          FILE="OnurDriveAI-Universal-Camera-Scanner-v0.3-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease --title "Universal Android Camera Interface Scanner v0.3 — diagnostic only" --notes "Native Android APK — read-only Camera2, Linux V4L2 names, sysfs, USB inventory and user-initiated parked-only Camera2 preview. MG HS 2023 installation and OEM camera accessibility NOT verified. No vehicle controls, CAN, firmware or speed override. If Android head unit blocks third-party APK installation, do not bypass safety protections. Coffee: https://www.patreon.com/c/onurguner"
          fi
