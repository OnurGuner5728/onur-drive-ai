name: Windows one-click LAB package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/build_windows.ps1'
      - '.github/workflows/windows-portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build portable executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Smoke-test compiled exe and donation link
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Resolve-Path 'dist/OnurDriveAI-Lab/OnurDriveAI-Lab.exe'
          $proc = Start-Process -FilePath $app -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 45; $i++) {
              if ($proc.HasExited) { throw "Program exited during startup ($($proc.ExitCode))" }
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:8765/api/status' -TimeoutSec 3
                $html = Invoke-WebRequest 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 3
                if ($status.vehicle_control -ne 'NOT_IMPLEMENTED') { throw 'Vehicle write guard missing' }
                if ($status.verified_oem_access -ne $false) { throw 'False claim of OEM integration' }
                if ($html.Content -notmatch 'www.patreon.com/c/onurguner') { throw 'Patreon link missing' }
                if ($status.source -eq 'multi-synthetic' -and $status.frames -ge 1) { $ok = $true; break }
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $ok) { throw 'Packaged EXE failed live local HTTP smoke test' }
          } finally { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
      - name: Package extract-and-double-click ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'portable' | Out-Null
          Copy-Item -Recurse 'dist/OnurDriveAI-Lab' 'portable/OnurDriveAI-Lab'
          @'
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0OnurDriveAI-Lab\OnurDriveAI-Lab.exe"
          '@ | Set-Content -Encoding ascii 'portable/BASLAT.bat'
          @'
          ONUR DRIVE AI - LABORATUVAR v0.2
          1. ZIP'i bir klasore ayiklayin.
          2. BASLAT.bat dosyasina cift tiklayin.
          3. Panel http://127.0.0.1:8765 adresinde acilir.
          Python kurulumu, ek kamera veya internet gerekmez.
          Bu yalnizca DORT SENTETIK kamerali LAB demosudur.
          MG HS fabrikasyon kameralari/ACC sistemine BAGLI DEGILDIR.
          Fabrika hiz sinirlamasini degistirmez; trafikte kullanmayin.
          Uygulamadan cikmak icin acilan komut penceresini kapatin.
          Windows imzasiz uygulama uyarisinda bulunabilir.
          Bir kahve ismarlamak isterseniz: https://www.patreon.com/c/onurguner
          '@ | Set-Content -Encoding utf8 'portable/BENI_OKU.txt'
          Compress-Archive -Path 'portable/*' -DestinationPath 'OnurDriveAI-Windows-TekTik-LAB-v0.2.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OnurDriveAI-Windows-TekTik-LAB-v0.2
          path: OnurDriveAI-Windows-TekTik-LAB-v0.2.zip
          retention-days: 30
      - name: Publish public prerelease after passing tests
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.2.0-lab'
          $asset = 'OnurDriveAI-Windows-TekTik-LAB-v0.2.zip'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --target $env:GITHUB_SHA --title 'Onur Drive AI v0.2 - Windows Tek Tik LAB' --prerelease --notes 'ZIP cikart ve BASLAT.bat dosyasina cift tikla. Yalnizca 4 sentetik kamerali LAB demosu. MG HS kamera ve ACC baglantisi YOK. Gonullu destek: https://www.patreon.com/c/onurguner'
          }
